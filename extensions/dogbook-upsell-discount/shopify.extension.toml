api_version = "2024-10"

[[extensions]]
name = "dogbook-upsell-discount"
handle = "dogbook-upsell-discount"
uid = "c9104017-05f4-fd1b-e87c-d53f36342eb020739b58"
type = "function"
description = "Applies the configured percent off to any cart line added by the checkout upsell extension (attribute _upsell_source=checkout)."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/run.graphql"
  export = "run"

  [extensions.build]
  command = "npm run build"
  path = "dist/function.wasm"
  wasm_opt = true
