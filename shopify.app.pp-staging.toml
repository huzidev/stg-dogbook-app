# Post-purchase build — STAGING (Vercel) configuration.
#
# Sibling of shopify.app.staging.toml. Same client_id, same Shopify app in
# the Partner Dashboard — this file exists only so post-purchase work can be
# isolated from the baseline staging config. Switch to it with:
#
#   shopify app config use pp-staging
#
# Revert path: `shopify app config use staging` and delete this file. The
# baseline shopify.app.staging.toml is untouched.
#
# Baseline parity: scopes, metafields, metaobjects, and webhooks mirror
# shopify.app.staging.toml. Divergence lives here as it accrues.

client_id = "cca3b701af7d14ec22301d7e329100c8"
application_url = "https://stg-dogbook-app.vercel.app"
embedded = true
name = "stg-dogbook-app"

[access_scopes]
# No new scopes required for post-purchase extensions.
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_orders"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[shop.metafields.app.post_purchase_offer]
type = "json"
name = "Post-purchase offer"
description = "Single-offer config for the post-purchase extension. JSON: {variantId:number, quantity:number, productTitle:string, description:string, imageUrl:string|null, discount:{value:number,valueType:'percentage'|'fixed_amount',title:string}}"

  [shop.metafields.app.post_purchase_offer.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

# Post-purchase offers (multiple, with optional trigger product + priority).
# When any enabled entry matches, it wins over the single shop metafield fallback.
[metaobjects.app.post_purchase_offer]
name = "Post-purchase offer"
description = "An offer shown on the post-purchase page. Multiple offers allowed; priority breaks ties. Trigger product is optional; empty means the offer applies to any order."

  [metaobjects.app.post_purchase_offer.access]
  admin = "merchant_read_write"

[metaobjects.app.post_purchase_offer.fields.offer]
name = "Offer JSON"
type = "json"
description = "{variantId:number, quantity:number, productTitle:string, description:string, imageUrl:string|null, discount:{value:number,valueType:'percentage'|'fixed_amount',title:string}}"
required = true

[metaobjects.app.post_purchase_offer.fields.trigger_product]
name = "Trigger product"
type = "product_reference"
description = "If set, this offer only shows when the buyer purchased this product. Leave empty to apply to all orders."

[metaobjects.app.post_purchase_offer.fields.priority]
name = "Priority"
type = "number_integer"
description = "Higher wins when multiple offers match. Default 0."

[metaobjects.app.post_purchase_offer.fields.enabled]
name = "Enabled"
type = "boolean"
description = "Uncheck to hide this offer without deleting it."

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [
  "https://stg-dogbook-app.vercel.app/api/auth",
  "https://stg-dogbook-app.vercel.app/auth/callback",
  "https://stg-dogbook-app.vercel.app/api/auth/callback"
]

[build]
# Staging is a fixed URL, not a dev tunnel — do not auto-update on `shopify app dev`.
automatically_update_urls_on_dev = false
