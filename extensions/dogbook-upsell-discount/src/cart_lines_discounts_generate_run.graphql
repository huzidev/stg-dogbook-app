query Input {
  cart {
    attribute(key: "_upsell_source") {
      value
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
